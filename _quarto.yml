project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!archive/"

website:
  title: "基礎數學"
  navbar:
    background: "#003366"  # 龍華藍
    foreground: white
    left:
      - text: "📅 課程內容"
        href: contents.qmd
      - text: "📝 課後作業"
        href: assignments.qmd
      - text: "📋 考試資訊"
        href: exams.qmd
      - text: "📜 更新紀錄"
        href: changelog.qmd

  sidebar:
    style: "floating"
    contents:
      - section: "課程資訊"
        contents:
          - index.qmd
          - contents.qmd
          - assignments.qmd
          - exams.qmd
          - changelog.qmd

  page-footer:
    left: "© 2025 龍華科技大學 基礎數學"
    center:
      - text: "📋 更新紀錄"
        href: changelog.qmd
    right: "114 學年度第 1 學期"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    code-copy: true
    lang: zh-TW

execute:
  freeze: auto
